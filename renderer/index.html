<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; script-src 'self'">
  <title>VidFetch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="titlebar">
    <div class="titlebar-brand">
      <svg class="logo" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M12 3a1 1 0 0 1 1 1v8.59l3.3-3.3a1 1 0 1 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.42l3.3 3.3V4a1 1 0 0 1 1-1Z"/>
        <path d="M5 19a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1Z"/>
      </svg>
      <span class="appname">VidFetch</span>
    </div>
    <div class="titlebar-actions">
      <button class="tbtn" id="btn-settings" data-i18n-title="settings" title="Настройки">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm9.6 4.2a1 1 0 0 1 0 1.6l-1.2.9c.06.3.1.6.1.9l1.1.9a1 1 0 0 1 0 1.6l-1.6 1.6a1 1 0 0 1-1.3 0l-1.3-.5a6 6 0 0 1-1.5.9l-.2 1.4a1 1 0 0 1-1 .8h-2.2a1 1 0 0 1-1-.8l-.2-1.4a6 6 0 0 1-1.5-.9l-1.3.5a1 1 0 0 1-1.3 0L3.5 19.9a1 1 0 0 1 0-1.6l1.1-.9c-.06-.3-.1-.6-.1-.9l-1.2-.9a1 1 0 0 1 0-1.6l1.6-1.6a1 1 0 0 1 1.3 0l1.3.5c.5-.4 1-.7 1.5-.9l.2-1.4a1 1 0 0 1 1-.8h2.2a1 1 0 0 1 1 .8l.2 1.4c.5.2 1 .5 1.5.9l1.3-.5a1 1 0 0 1 1.3 0l1.6 1.6Z"/></svg>
      </button>
      <button class="tbtn" id="btn-min" title="Свернуть">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12h14"/></svg>
      </button>
      <button class="tbtn" id="btn-max" title="Развернуть">
        <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button class="tbtn tbtn-close" id="btn-close" title="Закрыть">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <main class="content">

    <section class="hero">
      <div class="url-row">
        <div class="url-field">
          <svg viewBox="0 0 24 24" width="18" height="18" class="url-icon"><path d="M10 14a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1-1"/></svg>
          <input id="url-input" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="urlPlaceholder" placeholder="Вставьте ссылку на видео или плейлист…">
        </div>
        <button id="btn-paste" class="btn btn-secondary" data-i18n="paste">Вставить ссылку</button>
        <button id="btn-analyze" class="btn btn-primary" data-i18n="analyze">Скачать</button>
      </div>
      <div class="status-row">
        <span class="status-pill" id="status-pill" data-state="ready">
          <span class="dot"></span><span id="status-text" data-i18n="status.ready">Готово</span>
        </span>
      </div>
    </section>

    <section id="info-section" class="info-card hidden"></section>

    <section class="downloads">
      <div class="downloads-header">
        <h2 data-i18n="downloads">Загрузки</h2>
      </div>
      <div id="downloads-list" class="downloads-list"></div>
      <div id="empty-state" class="empty-state">
        <svg viewBox="0 0 24 24" width="40" height="40"><path d="M12 4a1 1 0 0 1 1 1v6.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.4L11 11.6V5a1 1 0 0 1 1-1Z"/><path d="M5 19a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1Z"/></svg>
        <p data-i18n="empty">Вставьте ссылку, чтобы начать загрузку</p>
      </div>
    </section>

  </main>

  <!-- ================= Download options dialog ================= -->
  <div id="dl-dialog" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 data-i18n="dlOptions.title">Параметры загрузки</h3>
        <button class="icon-btn modal-close" data-close="dl-dialog">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="dl-target" class="dl-target"></div>

        <div class="field">
          <label class="field-label" data-i18n="dlOptions.mode">Режим</label>
          <div class="segmented" id="seg-mode">
            <button class="seg active" data-value="video" data-i18n="dlOptions.video">Видео</button>
            <button class="seg" data-value="audio" data-i18n="dlOptions.audio">Только аудио</button>
          </div>
        </div>

        <div id="video-opts">
          <div class="field">
            <label class="field-label" data-i18n="dlOptions.format">Формат</label>
            <div class="segmented" id="seg-format">
              <button class="seg active" data-value="mp4">MP4</button>
              <button class="seg" data-value="mkv">MKV</button>
              <button class="seg" data-value="webm">WebM</button>
            </div>
          </div>
          <div class="field">
            <label class="field-label" data-i18n="dlOptions.quality">Качество</label>
            <div class="segmented wrap" id="seg-quality">
              <button class="seg" data-value="360">360p</button>
              <button class="seg" data-value="480">480p</button>
              <button class="seg" data-value="720">720p</button>
              <button class="seg active" data-value="1080">1080p</button>
              <button class="seg" data-value="1440">1440p</button>
              <button class="seg" data-value="2160">2160p</button>
            </div>
          </div>
        </div>

        <div id="audio-opts" class="hidden">
          <div class="field">
            <label class="field-label" data-i18n="dlOptions.format">Формат</label>
            <div class="segmented" id="seg-aformat">
              <button class="seg active" data-value="mp3">MP3</button>
              <button class="seg" data-value="m4a">M4A</button>
              <button class="seg" data-value="wav">WAV</button>
            </div>
          </div>
          <div class="field">
            <label class="field-label" data-i18n="dlOptions.aquality">Качество аудио</label>
            <div class="segmented" id="seg-aquality">
              <button class="seg active" data-value="best" data-i18n="dlOptions.best">Лучшее</button>
              <button class="seg" data-value="320">320 kbps</button>
              <button class="seg" data-value="192">192 kbps</button>
              <button class="seg" data-value="128">128 kbps</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="field-label" data-i18n="dlOptions.folder">Папка назначения</label>
          <div class="folder-row">
            <input id="dl-folder" type="text" readonly>
            <button class="btn btn-secondary btn-sm" id="btn-browse" data-i18n="dlOptions.browse">Обзор…</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" data-i18n="dlOptions.subtitles">Субтитры</label>
          <div class="row">
            <label class="switch">
              <input type="checkbox" id="dl-subtitles">
              <span class="track"></span>
            </label>
            <input id="dl-sublangs" type="text" class="text-input small" placeholder="en, ru" value="en, ru" data-i18n-placeholder="dlOptions.sublangsPlaceholder">
          </div>
        </div>

        <div class="field">
          <label class="checkbox-row">
            <input type="checkbox" id="dl-meta">
            <span data-i18n="dlOptions.metadata">Сохранить метаданные и обложку</span>
          </label>
        </div>

        <div id="playlist-note" class="note hidden"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close="dl-dialog" data-i18n="dlOptions.cancel">Отмена</button>
        <button class="btn btn-primary" id="btn-start-download" data-i18n="dlOptions.start">Начать загрузку</button>
      </div>
    </div>
  </div>

  <!-- ================= Settings dialog ================= -->
  <div id="settings-dialog" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 data-i18n="settings.title">Настройки</h3>
        <button class="icon-btn modal-close" data-close="settings-dialog">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label" data-i18n="settings.folder">Папка загрузок по умолчанию</label>
          <div class="folder-row">
            <input id="set-folder" type="text" readonly>
            <button class="btn btn-secondary btn-sm" id="btn-set-browse" data-i18n="dlOptions.browse">Обзор…</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" data-i18n="settings.concurrent">Одновременных загрузок</label>
          <div class="segmented" id="seg-concurrent">
            <button class="seg" data-value="1">1</button>
            <button class="seg active" data-value="2">2</button>
            <button class="seg" data-value="3">3</button>
            <button class="seg" data-value="5">5</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" data-i18n="settings.speedLimit">Ограничение скорости</label>
          <div class="segmented wrap" id="seg-speed">
            <button class="seg active" data-value="0" data-i18n="settings.unlimited">Без ограничений</button>
            <button class="seg" data-value="1">1 МБ/с</button>
            <button class="seg" data-value="2">2 МБ/с</button>
            <button class="seg" data-value="5">5 МБ/с</button>
            <button class="seg" data-value="10">10 МБ/с</button>
          </div>
        </div>

        <div class="field">
          <label class="checkbox-row">
            <input type="checkbox" id="set-clipboard">
            <span data-i18n="settings.clipboard">Автоматически добавлять ссылки из буфера обмена</span>
          </label>
        </div>

        <div class="field">
          <label class="field-label" data-i18n="settings.after">После завершения загрузки</label>
          <div class="segmented" id="seg-after">
            <button class="seg active" data-value="nothing" data-i18n="settings.nothing">Ничего</button>
            <button class="seg" data-value="openFolder" data-i18n="settings.openFolder">Открыть папку</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" data-i18n="settings.theme">Тема</label>
          <div class="segmented" id="seg-theme">
            <button class="seg" data-value="light" data-i18n="settings.light">Светлая</button>
            <button class="seg" data-value="dark" data-i18n="settings.dark">Тёмная</button>
            <button class="seg active" data-value="system" data-i18n="settings.system">Системная</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" data-i18n="settings.language">Язык интерфейса</label>
          <div class="segmented" id="seg-lang">
            <button class="seg" data-value="ru">Русский</button>
            <button class="seg" data-value="en">English</button>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary" data-close="settings-dialog" data-i18n="settings.done">Готово</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
